<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#018846">
<title>RDVmed — Groupe médical Al Nouf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RDVmed">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Oswald:wght@500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Jetons Groupe médical Al Nouf ===== */
:root{
  --green-600:#018846; --green-700:#016F39; --green-800:#01552B;
  --green-100:#D6F1E2; --green-50:#EDF9F2;
  --blue-700:#0F3A7A; --blue-600:#144999; --blue-500:#2E63BC; --blue-50:#EFF4FC;
  --grey-900:#12161A; --grey-800:#22292F; --grey-700:#3B454E; --grey-600:#55626D;
  --grey-500:#77848F; --grey-400:#A3AEB8; --grey-300:#C9D1D8; --grey-200:#E3E8ED;
  --grey-100:#F0F3F6; --grey-50:#F7F9FB; --white:#fff;
  --warning-600:#B26A00; --warning-100:#FCEEDA;
  --danger-600:#C0261F; --danger-100:#FBE2E0;

  --brand-primary:var(--green-600); --brand-secondary:var(--blue-600);
  --text-heading:var(--grey-900); --text-body:var(--grey-700); --text-muted:var(--grey-600);
  --surface-page:var(--grey-50); --surface-card:var(--white); --surface-sunken:var(--grey-100);
  --surface-brand-soft:var(--green-50); --surface-secondary-soft:var(--blue-50);
  --surface-overlay:rgba(18,22,26,.55);
  --border-subtle:var(--grey-200); --border-default:var(--grey-300); --border-brand:var(--green-600);

  --font-display:"Oswald","Arial Narrow",sans-serif;
  --font-sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,monospace;
  --text-3xs:12px; --text-2xs:13px; --text-xs:13px; --text-sm:14px;
  --text-base:16px; --text-lg:18px; --text-xl:21px; --text-2xl:26px;

  --radius-sm:3px; --radius-md:6px; --radius-lg:10px; --radius-xl:16px; --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(18,22,26,.06);
  --shadow-sm:0 1px 3px rgba(18,22,26,.08),0 1px 2px rgba(18,22,26,.04);
  --shadow-md:0 4px 12px rgba(18,22,26,.08);
  --shadow-lg:0 12px 28px rgba(18,22,26,.12);
  --shadow-xl:0 24px 56px rgba(18,22,26,.16);
  --shadow-focus:0 0 0 3px rgba(46,99,188,.32);
  --dur-fast:140ms; --dur-base:200ms; --dur-slow:320ms;
  --ease-standard:cubic-bezier(.2,.6,.2,1); --ease-out:cubic-bezier(0,.55,.45,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-body);
  background:var(--surface-page);display:flex;flex-direction:column;overflow:hidden}
a{color:var(--blue-600);text-decoration:none}
a:hover{color:var(--green-600);text-decoration:underline;text-underline-offset:3px}
svg{display:block}

/* ===== En-tête ===== */
header{flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;padding-top:env(safe-area-inset-top,0);height:calc(64px + env(safe-area-inset-top,0));
  background:var(--surface-card);border-bottom:1px solid var(--border-subtle);box-shadow:var(--shadow-sm)}
.lock{display:flex;align-items:center;gap:10px;min-width:0}
.lock img{height:30px;width:auto;flex:none}
.lock .nom{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:var(--text-lg);
  line-height:1.05;letter-spacing:.01em;color:var(--text-heading)}
.lock .sous{font-size:var(--text-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:1px}
.hdr-actions{display:flex;align-items:center;gap:6px;flex:none}

/* ===== Contrôles ===== */
.ib{width:40px;height:40px;border:none;background:none;border-radius:var(--radius-md);color:var(--text-body);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:background-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.ib:hover{background:var(--grey-100)}
.ib.sm{width:44px;height:44px}
.ib.outline{border:1px solid var(--border-default);background:var(--surface-card)}
.ib.outline:hover{background:var(--grey-100)}
.ib .pip{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--radius-pill);
  background:var(--danger-600);color:#fff;font-size:var(--text-3xs);font-weight:600;display:flex;align-items:center;
  justify-content:center;border:2px solid var(--surface-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;
  border:1px solid transparent;border-radius:var(--radius-md);font-family:inherit;font-size:var(--text-sm);
  font-weight:600;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-standard),
  border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.btn:active{transform:scale(.985)}
.btn.lg{height:48px;font-size:var(--text-base)}
.btn.sm{height:40px;padding:0 14px;font-size:var(--text-xs)}
.btn.full{width:100%}
.btn.primary{background:var(--green-600);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.btn.primary:hover{background:var(--green-700)}
.btn.primary:active{background:var(--green-800)}
.btn.secondary{background:var(--blue-600);color:#fff}
.btn.secondary:hover{background:var(--blue-700)}
.btn.outline{background:var(--surface-card);border-color:var(--border-default);color:var(--text-body)}
.btn.outline:hover{background:var(--grey-100)}
.btn.ghost{background:none;color:var(--text-body)}
.btn.ghost:hover{background:var(--grey-100)}
.btn.danger{background:var(--danger-600);color:#fff}
.btn.danger:hover{background:#9E1F19}
.tag{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--border-default);
  border-radius:var(--radius-pill);background:var(--surface-card);font-size:var(--text-xs);font-weight:600;
  color:var(--text-body);cursor:pointer;white-space:nowrap;
  transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.tag:hover{background:var(--grey-100)}
.tag.sel{border:2px solid var(--border-brand);background:var(--surface-brand-soft);color:var(--green-800);padding:0 13px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--radius-pill);
  font-size:var(--text-2xs);font-weight:600;white-space:nowrap}
.badge.neutral{background:var(--grey-100);color:var(--grey-600)}
.badge.success{background:var(--green-100);color:var(--green-800)}
.badge.info{background:var(--blue-50);color:var(--blue-700)}
.badge.warning{background:var(--warning-100);color:var(--warning-600)}
.badge.danger{background:var(--danger-100);color:var(--danger-600)}
label.lbl{display:block;font-size:var(--text-xs);font-weight:600;color:var(--text-heading);margin-bottom:6px}
.hint{font-size:var(--text-2xs);color:var(--text-muted);margin-top:5px;line-height:1.5}
input,textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-default);
  border-radius:var(--radius-md);font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-body);
  background:var(--surface-card);outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
input:focus,textarea:focus{border-color:var(--blue-500);box-shadow:var(--shadow-focus)}
input.mono{font-family:var(--font-mono);font-size:var(--text-sm)}
textarea{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5}
.srch{position:relative}
.srch input{padding-left:38px}
.srch .gl{position:absolute;left:11px;top:10px;color:var(--text-muted);pointer-events:none}

/* ===== Cartes ===== */
.card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xs);padding:16px}
.card.md{padding:20px}
.card.sunken{background:var(--surface-sunken);box-shadow:none}
.eyebrow{font-size:var(--text-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.h1{font-size:var(--text-xl);font-weight:600;color:var(--text-heading);line-height:1.2;margin:2px 0 0}
.sect{display:flex;align-items:center;gap:8px;margin:24px 0 12px}
.sect .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-pill);font-size:var(--text-2xs);
  font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--danger-100);color:var(--danger-600)}
.pnom{font-size:var(--text-lg);font-weight:600;color:var(--text-heading);line-height:1.2}
.pdate{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);margin-top:3px}
.pnote{font-size:var(--text-sm);color:var(--text-body);line-height:1.5;margin-top:8px}
.ppar{font-size:var(--text-2xs);color:var(--text-muted);margin-top:6px}
.prel{display:flex;align-items:center;gap:6px;font-size:var(--text-2xs);color:var(--blue-700);margin-top:6px}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pacts{display:flex;gap:8px;margin-top:14px}
.pacts .btn{flex:1;height:44px}
.vide{text-align:center;color:var(--text-muted);padding:8px}
.vide .ic{display:inline-flex;color:var(--grey-400)}
.vide .t{font-size:var(--text-base);font-weight:600;color:var(--text-heading);margin-top:10px}
.vide .d{font-size:var(--text-sm);margin-top:4px;line-height:1.5}

/* ===== Bande 14 jours ===== */
.bande{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.bande::-webkit-scrollbar{height:0}
.jour{flex:none;width:48px;padding:8px 0 6px;border:1px solid transparent;border-radius:var(--radius-md);
  background:var(--surface-sunken);cursor:pointer;font-family:inherit;text-align:center;
  transition:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}
.jour:hover{background:var(--grey-200)}
.jour .dw{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:var(--text-muted)}
.jour .nb{font-family:var(--font-mono);font-size:var(--text-base);font-weight:500;color:var(--text-heading);margin:2px 0 4px}
.jour .sl{height:18px;display:flex;align-items:center;justify-content:center}
.jour .sl span{min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--green-600);
  color:#fff;font-size:var(--text-3xs);font-weight:600;display:flex;align-items:center;justify-content:center}
.jour.auj{background:var(--surface-brand-soft);border:2px solid var(--border-brand);padding:7px 0 5px}
.jour.auj .dw{color:var(--brand-primary)}
.jour.sel{background:var(--surface-secondary-soft);border:2px solid var(--brand-secondary);padding:7px 0 5px}
.lgd{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:var(--text-2xs);color:var(--text-muted)}
.lgd span{display:flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:var(--radius-pill);background:var(--green-600)}
.lgd i.sq{border-radius:var(--radius-sm);background:none;border:2px solid var(--border-brand)}

/* ===== Zone défilante ===== */
main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0));
  scrollbar-width:none}
main::-webkit-scrollbar{width:0}
main>section{animation:fadeUp var(--dur-base) var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stk>*{animation:fadeUp var(--dur-base) var(--ease-out) both}
.stk>*:nth-child(2){animation-delay:40ms}
.stk>*:nth-child(3){animation-delay:80ms}
.stk>*:nth-child(4){animation-delay:120ms}
.stk>*:nth-child(n+5){animation-delay:160ms}
.mb12{margin-bottom:12px}

/* ===== Barre d'onglets ===== */
nav{flex:none;display:flex;align-items:flex-end;background:var(--surface-card);
  border-top:1px solid var(--border-subtle);padding-bottom:env(safe-area-inset-bottom,0)}
nav button.tb{position:relative;flex:1;border:none;background:none;cursor:pointer;font-family:inherit;
  padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);
  transition:color var(--dur-fast) var(--ease-standard)}
nav button.tb span{font-size:var(--text-xs);font-weight:600;letter-spacing:.04em;white-space:nowrap}
nav button.tb.actif{color:var(--brand-primary);box-shadow:inset 0 2px 0 var(--brand-primary)}
nav button.tb .pip{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--radius-pill);background:var(--danger-600);color:#fff;font-size:var(--text-3xs);
  font-weight:600;display:flex;align-items:center;justify-content:center}
.slot{flex:0 0 76px;display:flex;justify-content:center;align-items:flex-start}
#fab{transform:translateY(-22px);width:64px;height:64px;border-radius:var(--radius-pill);
  border:4px solid var(--surface-card);background:var(--brand-primary);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);
  transition:background-color var(--dur-fast) var(--ease-standard)}
#fab:hover{background:var(--green-700)}
#fab:active{background:var(--green-800)}

/* ===== Feuille plein écran ===== */
.feuille{position:fixed;inset:0;z-index:60;background:var(--surface-page);display:none;
  flex-direction:column;box-shadow:var(--shadow-xl)}
.feuille.ouverte{display:flex;animation:sheetUp var(--dur-slow) var(--ease-out) both}
.feuille .fh{flex:none;height:calc(64px + env(safe-area-inset-top,0));padding:env(safe-area-inset-top,0) 16px 0;
  display:flex;align-items:center;justify-content:space-between;background:var(--surface-card);
  border-bottom:1px solid var(--border-subtle)}
.feuille .fh b{font-size:var(--text-lg);font-weight:600;color:var(--text-heading)}
.feuille .fb{flex:1;min-height:0;overflow-y:auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0))}
.fld{margin-bottom:14px}

/* ===== Modale ===== */
#voile{position:fixed;inset:0;z-index:78;background:var(--surface-overlay);display:none;
  align-items:center;justify-content:center;padding:20px;animation:fadeIn var(--dur-base) both}
#voile.ouvert{display:flex}
.modale{background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
  width:100%;max-width:400px;max-height:80vh;overflow-y:auto;padding:20px;
  animation:sheetUp var(--dur-slow) var(--ease-out) both}
.modale .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.modale .mt{font-size:var(--text-lg);font-weight:600;color:var(--text-heading)}
.modale .md{font-size:var(--text-sm);color:var(--text-muted);margin-bottom:18px}
.nrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
.nrow .nn{font-size:var(--text-base);font-weight:600;color:var(--text-heading)}
.nrow .nq{font-size:var(--text-2xs);color:var(--text-muted);margin-top:2px}
.nrow i.dot{flex:none;width:10px;height:10px;border-radius:var(--radius-pill);background:var(--green-600)}
.nrow i.dot.urg{background:var(--danger-600)}

/* ===== Toast ===== */
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0));z-index:80;
  max-width:398px;margin:0 auto;background:var(--surface-card);border:1px solid var(--border-subtle);
  border-top:2px solid var(--green-600);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:12px 14px;display:none;animation:sheetUp var(--dur-base) var(--ease-out) both}
#toast.on{display:block}
#toast.info{border-top-color:var(--blue-600)}
#toast.warning{border-top-color:var(--warning-600)}
#toast.danger{border-top-color:var(--danger-600)}
#toast .tt{font-size:var(--text-sm);font-weight:600;color:var(--text-heading)}
#toast .td{font-size:var(--text-2xs);color:var(--text-muted);margin-top:2px;line-height:1.5}
#toast.on.act{display:flex;align-items:center;gap:12px}
#toast .tx{flex:1;min-width:0}
#toast .ta{flex:none;height:40px;padding:0 14px;border:none;border-radius:var(--radius-md);background:var(--surface-secondary-soft);
  color:var(--blue-700);font-family:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer}
.hsync{display:none;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-pill);
  background:var(--warning-100);color:var(--warning-600);font-size:var(--text-2xs);font-weight:600;white-space:nowrap}
.hsync.on{display:inline-flex}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grey-300);margin-right:6px}
.sdot.on{background:var(--green-600)} .sdot.err{background:var(--danger-600)}
/* ===== Accueil / connexion ===== */
#accueil{position:fixed;inset:0;z-index:75;background:var(--surface-page);display:none;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0)) 16px calc(24px + env(safe-area-inset-bottom,0))}
#accueil.ouvert{display:block;animation:fadeIn var(--dur-base) both}
#accueil .boite{max-width:400px;margin:0 auto}
#accueil .logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin:12px 0 22px}
#accueil .logo img{height:56px;width:auto;margin-bottom:12px}
#accueil .titre{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:var(--text-2xl);
  letter-spacing:.01em;color:var(--text-heading);line-height:1.1}
#accueil .st{font-size:var(--text-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:4px}
#accueil .q{font-size:var(--text-lg);font-weight:600;color:var(--text-heading);margin-bottom:6px}
#accueil .exp{font-size:var(--text-sm);line-height:1.5;margin-bottom:16px}
#accueil .lien{background:none;border:none;font-family:inherit;font-size:var(--text-sm);color:var(--blue-600);
  cursor:pointer;padding:8px 0}
#a_code{font-family:var(--font-mono);font-size:var(--text-2xl);letter-spacing:.3em;text-align:center;height:56px}
.postes{display:flex;flex-wrap:wrap;gap:6px}
.btn[disabled]{opacity:.55;pointer-events:none}
.coche{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:var(--text-sm);color:var(--text-body);cursor:pointer}
.coche input{width:22px;height:22px;flex:none;accent-color:var(--brand-primary);box-shadow:none}
.etapes{margin:14px 0 4px;padding:0;list-style:none;counter-reset:e}
.etapes li{counter-increment:e;display:flex;gap:12px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--border-subtle);font-size:var(--text-sm);line-height:1.5}
.etapes li:last-child{border-bottom:none}
.etapes li::before{content:counter(e);flex:none;width:24px;height:24px;border-radius:var(--radius-pill);
  background:var(--surface-brand-soft);color:var(--green-800);font-weight:600;font-size:var(--text-xs);
  display:flex;align-items:center;justify-content:center}
.etapes .ic{display:inline-flex;vertical-align:-4px;color:var(--blue-600)}
/* ===== Écran d'ouverture ===== */
#splash{position:fixed;inset:0;z-index:100;background:var(--surface-page);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;cursor:pointer;
  transition:opacity 420ms var(--ease-standard),transform 420ms var(--ease-standard)}
#splash.fin{opacity:0;transform:scale(1.04);pointer-events:none}
#splash img{height:84px;width:auto;opacity:0;animation:spLogo 700ms cubic-bezier(.2,1.4,.4,1) 80ms forwards}
#splash .mot{display:flex;margin-top:18px;font-family:var(--font-display);font-weight:600;font-size:40px;
  letter-spacing:.06em;color:var(--text-heading);line-height:1;overflow:hidden;padding:2px 0}
#splash .mot span{display:inline-block;opacity:0;transform:translateY(100%);
  animation:spLettre 520ms var(--ease-out) forwards}
#splash .mot span.med{color:var(--brand-primary)}
#splash .trait{width:0;height:3px;border-radius:var(--radius-pill);background:var(--brand-primary);margin:14px 0 10px;
  animation:spTrait 600ms var(--ease-out) 760ms forwards}
#splash .st{font-size:var(--text-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);
  opacity:0;animation:fadeIn 500ms var(--ease-out) 950ms forwards}
@keyframes spLogo{0%{opacity:0;transform:scale(.6) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes spLettre{to{opacity:1;transform:none}}
@keyframes spTrait{to{width:64px}}
@media (prefers-reduced-motion:reduce){
  #splash img,#splash .mot span,#splash .st{animation:fadeIn 300ms both}
  #splash .trait{animation:none;width:64px}
}
@media (prefers-reduced-motion:reduce){
  main>section,.stk>*,.feuille.ouverte,.modale,#toast{animation:fadeIn var(--dur-fast) both}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true" onclick="finSplash()">
  <img src="logo-mark.svg" alt="" onerror="this.src='icon-192.png'">
  <div class="mot" id="splashMot"></div>
  <div class="trait"></div>
  <div class="st">Groupe médical Al Nouf</div>
</div>
<script>
/* Écran d'ouverture : le nom s'écrit lettre par lettre pendant que l'app démarre dessous. */
(function(){
  var m=document.getElementById('splashMot');
  'RDVMED'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;
    if(i>=3)s.className='med';s.style.animationDelay=(300+i*70)+'ms';m.appendChild(s);});
  window.finSplash=function(){var sp=document.getElementById('splash');if(!sp||sp.classList.contains('fin'))return;
    sp.classList.add('fin');setTimeout(function(){sp.remove();},450);};
  var court=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(window.finSplash,court?700:1700);
})();
</script>

<header>
  <div class="lock">
    <img src="logo-mark.svg" alt="" onerror="this.src='icon-192.png'">
    <div>
      <div class="nom">RDVmed</div>
      <div class="sous">Groupe médical Al Nouf</div>
    </div>
  </div>
  <div class="hdr-actions">
    <span class="hsync" id="etatSync" role="status"></span>
    <button class="ib" id="btnCloche" onclick="ouvrirRappels()" aria-label="Rappels de rendez-vous"></button>
    <button class="ib" onclick="ouvrirOnglet('reglages')" aria-label="Utilisateur et réglages"></button>
  </div>
</header>

<main id="vue"></main>

<nav>
  <button class="tb actif" id="nav-jour" onclick="ouvrirOnglet('jour')"></button>
  <button class="tb" id="nav-avenir" onclick="ouvrirOnglet('avenir')"></button>
  <div class="slot"><button id="fab" onclick="ouvrirNouveau()" aria-label="Nouveau suivi" title="Nouveau suivi"></button></div>
  <button class="tb" id="nav-histo" onclick="ouvrirOnglet('histo')"></button>
  <button class="tb" id="nav-reglages" onclick="ouvrirOnglet('reglages')"></button>
</nav>

<div class="feuille" id="feuilleForm">
  <div class="fh"><b id="titreForm">Nouveau suivi</b>
    <button class="ib" onclick="fermerForm()" aria-label="Fermer le formulaire"></button></div>
  <div class="fb">
    <div class="fld"><label class="lbl" for="f_nom">Nom du patient *</label>
      <input type="text" id="f_nom" placeholder="ex. Aïcha Koné" autocomplete="off"></div>
    <div class="fld"><label class="lbl" for="f_tel">Téléphone</label>
      <input type="tel" id="f_tel" class="mono" placeholder="07 08 51 63 08" inputmode="tel">
      <div class="hint">Nécessaire pour la relance WhatsApp, SMS ou l'appel.</div>
      <label class="coche" for="f_sms"><input type="checkbox" id="f_sms" checked>
        <span>Rappel SMS automatique au patient avant le rendez-vous</span></label></div>
    <div class="fld"><label class="lbl">Type de passage *</label>
      <div class="chips" id="f_type" style="display:flex;flex-wrap:wrap;gap:6px">
        <button class="tag" data-v="specialiste" onclick="selType(this)">RDV spécialiste</button>
        <button class="tag" data-v="posthosp" onclick="selType(this)">Post-hospitalisation</button>
        <button class="tag sel" data-v="controle" onclick="selType(this)">Contrôle</button>
      </div></div>
    <div class="fld"><label class="lbl" for="f_spec">Spécialité ou motif</label>
      <input type="text" id="f_spec" list="specs" placeholder="ex. Cardiologie" autocomplete="off">
      <datalist id="specs">
        <option>Cardiologie</option><option>Gynécologie</option><option>Pédiatrie</option>
        <option>Chirurgie</option><option>Ophtalmologie</option><option>ORL</option>
        <option>Dermatologie</option><option>Neurologie</option><option>Gastro-entérologie</option>
        <option>Urologie</option><option>Rhumatologie</option><option>Pneumologie</option>
        <option>Endocrinologie</option><option>Psychiatrie</option><option>Kinésithérapie</option>
        <option>Pansement</option><option>Bilan de contrôle</option><option>Retrait de fils</option>
      </datalist></div>
    <div class="fld"><label class="lbl" for="f_date">Date prévue *</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        <button class="tag" onclick="dateRapide(3,this)">+3 j</button>
        <button class="tag" onclick="dateRapide(7,this)">+7 j</button>
        <button class="tag" onclick="dateRapide(15,this)">+15 j</button>
        <button class="tag" onclick="dateRapide(30,this)">+1 mois</button>
        <button class="tag" onclick="dateRapide(90,this)">+3 mois</button>
      </div>
      <input type="date" id="f_date">
      <label class="lbl" for="f_heure" style="margin-top:12px">Heure <span style="font-weight:400;color:var(--text-muted)">(facultatif)</span></label>
      <input type="time" id="f_heure" style="max-width:160px"></div>
    <div class="fld"><label class="lbl" for="f_note">Note</label>
      <textarea id="f_note" placeholder="ex. Apporter le carnet et les dernières analyses."></textarea></div>
    <button class="btn primary lg full" onclick="enregistrer()" id="btnSave">Enregistrer le suivi</button>
  </div>
</div>

<div id="accueil" role="dialog" aria-modal="true" aria-label="Connexion à RDVmed"><div class="boite" id="accueilCorps"></div></div>
<div id="voile" onclick="if(event.target===this)fermerVoile()"><div class="modale" id="modale"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="push-client.js"></script>
<script>
/* ============ ICÔNES (Lucide, tracé inline — fonctionne hors-ligne) ============ */
const P={
 'calendar-check':'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
 'calendar-days':'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
 'history':'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
 'settings-2':'<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
 'bell':'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
 'plus':'<path d="M5 12h14"/><path d="M12 5v14"/>',
 'check':'<path d="M20 6 9 17l-5-5"/>',
 'x':'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 'phone':'<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
 'message-circle':'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 'message-square':'<path d="M22 17a2 2 0 0 1-2 2H6l-4 4V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>',
 'more-horizontal':'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
 'search':'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 'alert-triangle':'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 'rotate-ccw':'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
 'trash-2':'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
 'download':'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
 'save':'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
 'folder-open':'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
 'refresh-cw':'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
 'user-round':'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
 'pencil':'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
 'wifi-off':'<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
 'share':'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
 'square-plus':'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/>',
 'more-vertical':'<circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>',
 'smartphone':'<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
 'log-out':'<path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>',
 'mail':'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
 'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 'user-x':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5"/><path d="m22 8-5 5"/>',
 'bell-ring':'<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/>'
};
function ico(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(P[n]||'')+'</svg>';}

/* ============ ÉTAT ============ */
const CLE='rdvmed_data';
const CAB_DEFAUT={nom:'Groupe médical Al Nouf',tel:'21 50 03 65 62',adresse:'San Pedro, Bardot 2'};
let etat=charger(), ongletActif='jour', editId=null, cibleId=null, jourSel=null;
let filtreType='', rechA='', rechH='';
function charger(){
  try{const d=JSON.parse(localStorage.getItem(CLE));
    if(d&&d.records){if(d.leadDays==null)d.leadDays=3;
      d.cab=Object.assign({},CAB_DEFAUT,d.cab||{});return d;}}catch(e){}
  return {records:[],user:'',supa:{url:'',key:''},lastPull:'',lastPush:'',leadDays:3,auth:null,membre:null,
    cab:Object.assign({},CAB_DEFAUT)};
}
const POSTES={medecin:'Médecin',secretaire:'Secrétaire',gerant:'Gérant'};
function pret(){return !!(etat.supa.url&&etat.supa.key&&etat.auth&&etat.membre&&etat.membre.valide);}
function estMedecin(){return pret()&&etat.membre.poste==='medecin';}
function sauver(){localStorage.setItem(CLE,JSON.stringify(etat));}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);}
function iso(off){const d=new Date();d.setDate(d.getDate()+(off||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function auj(){return iso(0);}
function ecart(s){const a=new Date(auj()+'T12:00:00'),b=new Date(s+'T12:00:00');return Math.round((b-a)/864e5);}
function fmtLong(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function fmtCourt(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
const NOMTYPE={specialiste:'RDV spécialiste',posthosp:'Post-hospitalisation',controle:'Contrôle'};
function fmtHeure(h){return /^\d\d:\d\d$/.test(h||'')?h.replace(':',' h '):'';}
function quandCourt(t){if(!t)return'';const d=new Date(t),h=String(d.getHours()).padStart(2,'0')+' h '+String(d.getMinutes()).padStart(2,'0');
  const j=Math.round((new Date(auj()+'T12:00:00')-new Date(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T12:00:00'))/864e5);
  return j===0?'aujourd\u2019hui '+h:j===1?'hier '+h:'le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+h;}
function sansAccent(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
/* Recherche par nom (sans tenir compte des accents) ou par numéro de téléphone */
function correspond(r,q){if(!q)return true;if(sansAccent(r.nom).includes(sansAccent(q)))return true;
  const d=q.replace(/\D/g,'');return d.length>=3&&(r.tel||'').replace(/\D/g,'').includes(d);}
const parDateHeure=(a,b)=>(a.date+(a.heure||'99:99'))<(b.date+(b.heure||'99:99'))?-1:1;
const DOWS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function ech(t){return String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function actifs(){return etat.records.filter(r=>!r.deleted&&r.statut==='attente');}
function retards(){return actifs().filter(r=>r.date<auj()).sort(parDateHeure);}
function imminents(){const l=+etat.leadDays||3;
  return actifs().filter(r=>{const e=ecart(r.date);return e>=1&&e<=l;}).sort((a,b)=>a.date<b.date?-1:1);}

/* ============ RENDU ============ */
function rendre(){
  document.querySelector('.lock .sous').textContent=etat.cab.nom;
  majEtatSync();
  document.getElementById('btnCloche').innerHTML=ico('bell',20)+
    (imminents().length?'<span class="pip">'+imminents().length+'</span>':'');
  document.querySelector('.hdr-actions .ib:last-child').innerHTML=ico('user-round',20);
  document.querySelector('#fab').innerHTML=ico('plus',30);
  document.querySelector('#feuilleForm .fh .ib').innerHTML=ico('x',20);
  const nR=retards().length;
  const tb=[['jour','calendar-check',"Aujourd'hui",nR],['avenir','calendar-days','À venir',0],
            ['histo','history','Historique',0],['reglages','settings-2','Réglages',enAttente().length]];
  tb.forEach(([k,i,l,n])=>{const b=document.getElementById('nav-'+k);
    b.className='tb'+(ongletActif===k?' actif':'');
    b.innerHTML=ico(i,22)+'<span>'+l+'</span>'+(n?'<span class="pip">'+n+'</span>':'');});
  const v=document.getElementById('vue');
  v.innerHTML='<section>'+(ongletActif==='jour'?vueJour():ongletActif==='avenir'?vueAvenir():
    ongletActif==='histo'?vueHisto():vueReglages())+'</section>';
  v.scrollTop=0;
}
function ouvrirOnglet(o){ongletActif=o;jourSel=null;rendre();if(o==='reglages'&&estMedecin())chargerEquipe();}
function rendreSurPlace(){const v=document.getElementById('vue'),y=v.scrollTop;rendre();v.scrollTop=y;}
/* Rafraîchissement venu d'ailleurs (synchro, équipe) : on n'efface pas une saisie en cours,
   on attend que le champ soit quitté. */
let aRedessiner=false;
function rendreSiLibre(){
  const a=document.activeElement;
  if(a&&document.getElementById('vue').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){aRedessiner=true;return;}
  rendreSurPlace();
}
document.addEventListener('focusout',()=>{if(aRedessiner){aRedessiner=false;setTimeout(rendreSiLibre,0);}});

function badge(r){const e=ecart(r.date);
  if(e<0)return '<span class="badge danger">'+ico('alert-triangle',14)+'Retard de '+(-e)+'\u00A0j</span>';
  if(e===0)return '<span class="badge success">'+ico('calendar-check',14)+'Aujourd\u2019hui</span>';
  return '<span class="badge info">'+ico('calendar-days',14)+'Dans '+e+'\u00A0j</span>';
}
function carte(r){
  return '<div class="card mb12">'+
    '<div class="prow"><div style="min-width:0"><div class="pnom">'+ech(r.nom)+'</div>'+
      '<div class="pdate">'+fmtCourt(r.date)+(r.heure?' · '+fmtHeure(r.heure):'')+'</div></div>'+badge(r)+'</div>'+
    '<div class="ptags"><span class="badge neutral">'+ (NOMTYPE[r.type]||ech(r.type)) +'</span>'+
      (r.spec?'<span class="badge neutral">'+ech(r.spec)+'</span>':'')+'</div>'+
    (r.note?'<div class="pnote">'+ech(r.note)+'</div>':'')+
    (r.created_by?'<div class="ppar">Ajouté par '+ech(r.created_by)+'</div>':'')+
    (r.relance_at?'<div class="prel">'+ico(CANAUX[r.relance_canal]?CANAUX[r.relance_canal][1]:'phone',14)+'Relancé'+
      (r.relance_by?' par '+ech(r.relance_by):'')+(CANAUX[r.relance_canal]?' · '+CANAUX[r.relance_canal][0]:'')+' · '+quandCourt(r.relance_at)+'</div>':'')+
    '<div class="pacts">'+
      '<button class="btn primary sm" onclick="marquerVu(\''+r.id+'\')">'+ico('check',16)+'Vu</button>'+
      (r.tel?'<button class="ib sm outline" onclick="relanceWA(\''+r.id+'\')" aria-label="Relancer par WhatsApp">'+ico('message-circle',16)+'</button>'+
             '<button class="ib sm outline" onclick="relanceSMS(\''+r.id+'\')" aria-label="Relancer par SMS">'+ico('message-square',16)+'</button>'+
             '<button class="ib sm outline" onclick="appeler(\''+r.id+'\')" aria-label="Appeler le patient">'+ico('phone',16)+'</button>':'')+
      '<button class="ib sm" onclick="ouvrirPlus(\''+r.id+'\')" aria-label="Modifier, reporter ou annuler">'+ico('more-horizontal',16)+'</button>'+
    '</div></div>';
}
function bandeHTML(){
  const parJ={};actifs().forEach(r=>{parJ[r.date]=(parJ[r.date]||0)+1;});
  let h='<div class="card" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:12px">Les 14 prochains jours</div><div class="bande">';
  for(let i=0;i<14;i++){
    const d=new Date(auj()+'T12:00:00');d.setDate(d.getDate()+i);
    const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const n=parJ[s]||0, cls='jour'+(i===0?' auj':'')+(jourSel===s?' sel':'');
    h+='<button class="'+cls+'" onclick="choisirJour(\''+s+'\')" aria-label="'+fmtLong(s)+(n?' — '+n+' passage(s)':' — aucun passage')+'">'+

async function changerCabinet(k,v){
  v=v.trim();if(k==='nom'&&!v){rendreSurPlace();return;}
  const avant=etat.cab[k];etat.cab[k]=v;sauver();rendreSurPlace();
  try{await api('cabinet?id=eq.1',{method:'PATCH',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({[k]:v,updated_at:new Date().toISOString()})});
    toast('Identité du cabinet mise à jour','Visible sur tous les postes.');}
  catch(e){etat.cab[k]=avant;sauver();rendreSurPlace();toast('Modification impossible',e.message,'danger');}
}
async function chargerCabinet(){
  try{const l=await api('cabinet?id=eq.1&select=nom,tel,adresse');
    if(l&&l[0]){etat.cab=Object.assign({},CAB_DEFAUT,l[0]);sauver();}}catch(e){}
}

function ouvrirFormulaire(r){
  editId=r?r.id:null;
  document.getElementById('titreForm').textContent=r?'Modifier le suivi':'Nouveau suivi';
  document.getElementById('btnSave').textContent=r?'Enregistrer les modifications':'Enregistrer le suivi';
  const v={f_nom:'nom',f_tel:'tel',f_spec:'spec',f_note:'note',f_date:'date',f_heure:'heure'};
  for(const i in v)document.getElementById(i).value=r?(r[v[i]]||''):'';
  document.getElementById('f_sms').checked=r?r.sms_auto!==false:true;
  document.querySelectorAll('.fld .tag[onclick^="dateRapide"]').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('#f_type .tag').forEach(c=>c.classList.toggle('sel',c.dataset.v===(r?r.type:'controle')));

function fermerForm(){document.getElementById('feuilleForm').classList.remove('ouverte');}
function selType(el){document.querySelectorAll('#f_type .tag').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function dateRapide(j,el){document.getElementById('f_date').value=iso(j);
  if(el){el.parentNode.querySelectorAll('.tag').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}}
async function enregistrer(){
  const nom=document.getElementById('f_nom').value.trim().replace(/\s+/g,' '), date=document.getElementById('f_date').value;
  const sel=document.querySelector('#f_type .tag.sel'), type=sel?sel.dataset.v:'controle';
  if(!nom){toast('Nom manquant','Renseignez le nom du patient.','danger');return;}
  if(!date){toast('Date manquante','Choisissez la date prévue.','danger');return;}
  const champs={nom,type,date,tel:document.getElementById('f_tel').value.trim(),
    spec:document.getElementById('f_spec').value.trim(),heure:document.getElementById('f_heure').value||'',
    note:document.getElementById('f_note').value.trim(),sms_auto:document.getElementById('f_sms').checked};
  const t=new Date().toISOString();
  if(editId){
    const r=etat.records.find(x=>x.id===editId);if(!r){fermerForm();return;}
    const avant=memoriser(r);
    Object.assign(r,champs,{updated_at:t});
    sauver();fermerForm();rendreSurPlace();syncAuto();planifierRappels();
    toastAnnulable('Fiche modifiée',r.nom+' · '+fmtLong(r.date),r,avant);
    return;
  }
  // Même patient déjà en attente : on prévient avant de créer un doublon.
  const dbl=actifs().find(x=>sansAccent(x.nom)===sansAccent(nom));
  if(dbl&&!await demander({titre:'Patient déjà suivi',
      texte:dbl.nom+' a déjà un rendez-vous en attente le '+fmtLong(dbl.date)+(dbl.heure?' à '+fmtHeure(dbl.heure):'')+'. Enregistrer quand même un nouveau suivi ?',
      ok:'Enregistrer quand même'}))return;
  const nouveau=Object.assign({id:uuid()},champs,{statut:'attente',vu_at:null,
    created_by:etat.user||'',deleted:0,created_at:t,updated_at:t});
  etat.records.push(nouveau);
  sauver();fermerForm();ongletActif=ecart(date)>0?'avenir':'jour';rendre();
  toast('Suivi enregistré',nom+' · '+fmtLong(date));syncAuto();planifierRappels();
  notifierAutres(nouveau);
}
async function notifierAutres(r){
  if(!window.RDVmedPush||!pret())return;
  try{RDVmedPush.notifierNouveau({supabaseUrl:etat.supa.url,supabaseAnonKey:etat.supa.key,token:await jeton()},r);}catch(e){}
}

/* Annulation : on garde l'état d'avant, et « Annuler » le remet avec une date de modification
   plus récente, pour que la correction l'emporte aussi sur les autres postes. */
let _annuler=null;
function memoriser(r){return JSON.parse(JSON.stringify(r));}
function toastAnnulable(titre,texte,r,avant,tone){
  const f=()=>{Object.assign(r,avant,{updated_at:new Date().toISOString()});
    sauver();rendreSurPlace();syncAuto();planifierRappels();toast('Action annulée',r.nom,'info');};
  toast(titre,texte,tone,{label:'Annuler',fn:'annulerDerniere()'});
  _annuler=f;
}
function annulerDerniere(){const f=_annuler;_annuler=null;if(f)f();}
function marquerVu(id){const r=etat.records.find(x=>x.id===id);if(!r)return;
  const avant=memoriser(r);
  r.statut='vu';r.vu_at=new Date().toISOString();r.updated_at=r.vu_at;
  sauver();rendreSurPlace();syncAuto();toastAnnulable('Patient marqué vu',r.nom+' passe à l’historique.',r,avant);}
function ouvrirPlus(id){cibleId=id;const r=etat.records.find(x=>x.id===id);
  document.getElementById('modale').innerHTML=
   '<div class="mh"><div><div class="mt">'+ech(r?r.nom:'')+'</div>'+
   '<div class="md" style="margin-bottom:0">'+(r?fmtLong(r.date)+(r.heure?' à '+fmtHeure(r.heure):''):'')+'</div></div>'+
   '<button class="ib" onclick="fermerVoile()" aria-label="Fermer">'+ico('x',20)+'</button></div>'+
   '<button class="btn outline full" style="margin-top:14px" onclick="ouvrirEdition(\''+id+'\')">'+ico('pencil',18)+'Modifier la fiche</button>'+
   '<div class="eyebrow" style="margin:16px 0 10px">Reporter de</div>'+
   '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
   [[3,'3 jours'],[7,'7 jours'],[15,'15 jours'],[30,'1 mois']].map(([j,l])=>
     '<button class="tag" onclick="reporter('+j+')">'+l+'</button>').join('')+'</div>'+
   '<input type="date" id="r_date" onchange="reporterDate(this.value)" style="margin-bottom:16px">'+
   '<button class="btn danger full" onclick="annulerRdv()">'+ico('user-x',18)+'Annuler — perdu de vue</button>';
  document.getElementById('voile').classList.add('ouvert');}
function fermerVoile(){document.getElementById('voile').classList.remove('ouvert');if(_reponse)repondre(false);}
function reporter(j){reporterDate(iso(j));}
function reporterDate(v){if(!v)return;const r=etat.records.find(x=>x.id===cibleId);if(!r)return;
  const avant=memoriser(r);
  r.date=v;r.updated_at=new Date().toISOString();sauver();fermerVoile();rendreSurPlace();syncAuto();planifierRappels();
  toastAnnulable('Rendez-vous reporté','Nouvelle date : '+fmtLong(v)+'.',r,avant);}
function annulerRdv(){const r=etat.records.find(x=>x.id===cibleId);if(!r)return;
  const avant=memoriser(r);
  r.statut='annule';r.vu_at=new Date().toISOString();r.updated_at=r.vu_at;
  sauver();fermerVoile();rendreSurPlace();syncAuto();toastAnnulable('Suivi annulé',r.nom+' est marqué perdu de vue.',r,avant,'warning');}
function reprogrammer(id){const r=etat.records.find(x=>x.id===id);if(!r)return;
  const avant=memoriser(r);
  r.statut='attente';r.vu_at=null;r.date=iso(7);r.updated_at=new Date().toISOString();
  sauver();rendreSurPlace();syncAuto();toastAnnulable('Suivi reprogrammé',r.nom+' · '+fmtLong(r.date)+' (onglet À venir)',r,avant);}
async function supprimer(id){const r=etat.records.find(x=>x.id===id);if(!r)return;
  if(!estMedecin()){toast('Réservé au médecin','Seul un médecin peut supprimer une fiche.','warning');return;}

let _reponse=null;
function demander(o){
  return new Promise(res=>{
    if(_reponse)_reponse(false);_reponse=res;
    document.getElementById('modale').innerHTML='<div class="mt">'+ech(o.titre)+'</div>'+
      '<div class="md" style="margin:8px 0 20px;line-height:1.5">'+ech(o.texte)+'</div>'+
      '<div style="display:flex;gap:8px"><button class="btn outline" style="flex:1" onclick="repondre(false)">'+ech(o.annuler||'Retour')+'</button>'+
      '<button class="btn '+(o.danger?'danger':'primary')+'" style="flex:1.4" onclick="repondre(true)">'+ech(o.ok||'Confirmer')+'</button></div>';
    document.getElementById('voile').classList.add('ouvert');
  });
}
function repondre(v){const f=_reponse;_reponse=null;document.getElementById('voile').classList.remove('ouvert');if(f)f(v);}
function telIntl(t){let d=(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);
  if(d.length===10&&d.startsWith('0'))d='225'+d;return d;}
const CANAUX={whatsapp:['WhatsApp','message-circle'],sms:['SMS','message-square'],appel:['appel','phone']};
/* Note la relance sur la fiche : visible par tous les postes, pour éviter les doubles appels. */
function noterRelance(r,canal){const t=new Date().toISOString();
  Object.assign(r,{relance_at:t,relance_by:etat.user||'',relance_canal:canal,updated_at:t});
  sauver();rendreSurPlace();syncAuto();}
function relanceWA(id){const r=etat.records.find(x=>x.id===id);if(!r)return;
  const m=msgRappel(r);noterRelance(r,'whatsapp');
  window.open('https://wa.me/'+telIntl(r.tel)+'?text='+encodeURIComponent(m),'_blank');}
function msgRappel(r){const c=etat.cab;
  return 'Bonjour '+r.nom+', rappel de votre rendez-vous prévu le '+fmtLong(r.date)+(r.heure?' à '+fmtHeure(r.heure):'')+
    (r.spec?' ('+r.spec+')':'')+'. Merci de passer nous voir.\n'+
    (c.nom||'Groupe médical Al Nouf')+'\nPour toute question, appelez uniquement le '+(c.tel||'21 50 03 65 62')+'.';}
function relanceSMS(id){const r=etat.records.find(x=>x.id===id);if(!r)return;
  if(!r.tel){toast('Numéro manquant','Ajoutez un téléphone pour envoyer un SMS.','danger');return;}
  noterRelance(r,'sms');

  location.href='sms:'+telIntl(r.tel).replace(/^/,'+')+sep+'body='+encodeURIComponent(msgRappel(r));}
function appeler(id){const r=etat.records.find(x=>x.id===id);if(!r)return;noterRelance(r,'appel');location.href='tel:'+(r.tel||'');}

async function activerNotif(){
  if(etatNotif()==='unsupported'){toast('Non disponible','Les notifications ne fonctionnent pas ici.','warning');return;}
  try{
    // Demandée tout de suite, pendant le geste de l'utilisateur (sinon iPhone refuse).
    if(await Notification.requestPermission()!=='granted'){
      toast('Autorisation refusée','Réactivez les notifications dans les réglages du téléphone.','danger');rendre();return;}
    if(window.RDVmedPush&&pret()){
      await RDVmedPush.activer({supabaseUrl:etat.supa.url,supabaseAnonKey:etat.supa.key,token:await jeton(),
        membreId:etat.auth.user.id,utilisateur:etat.membre.nom});
    }else{
      const p=await Notification.requestPermission();
      if(p!=='granted'){toast('Autorisation refusée','Réactivez les notifications dans le navigateur.','danger');rendre();return;}
    }
    try{new Notification('RDVmed',{body:'Notifications activées. Vous serez prévenu avant chaque rendez-vous.',icon:'icon-192.png'});}catch(e){}
    toast('Notifications activées','Vous serez prévenu '+etat.leadDays+'\u00A0jours avant.');
    rendre();planifierRappels();
  }catch(e){toast('Échec de l\u2019activation',e.message||'','danger');rendre();}
}
/* Autorisation déjà donnée : on (ré)inscrit ce téléphone sans rien demander,
   pour qu'il reçoive bien les notifications même s'il n'était pas enregistré. */
async function abonnerSilencieux(){

  try{await RDVmedPush.activer({supabaseUrl:etat.supa.url,supabaseAnonKey:etat.supa.key,token:await jeton(),
    membreId:etat.auth.user.id,utilisateur:etat.membre.nom});}catch(e){}
}
/* Première entrée dans l'application : proposer d'activer les notifications.
   Si la personne répond « Plus tard », on repose la question 3 jours après. */
function proposerNotif(){
  if(!pret()||etatNotif()!=='default')return;
  let quand=0;try{quand=+localStorage.getItem('rdvmed-notif-plus-tard')||0;}catch(e){}
  if(Date.now()-quand<3*864e5)return;
  setTimeout(async()=>{
    if(!pret()||etatNotif()!=='default'||document.getElementById('voile').classList.contains('ouvert'))return;
    const ok=await demander({titre:'Activer les notifications ?',ok:'Activer',annuler:'Plus tard',
      texte:'Votre téléphone sonnera quand un collègue ajoute un rendez-vous, et chaque matin pour les rendez-vous du jour, même quand l\u2019application est fermée.'});
    if(ok)activerNotif();
    else{try{localStorage.setItem('rdvmed-notif-plus-tard',String(Date.now()));}catch(e){}}
  },2500);
}
function testNotif(){
  if(etatNotif()!=='granted'){activerNotif();return;}
  const l=imminents(), r=l[0];

  for(const r of etat.records.filter(x=>!x.deleted))
    L.push([r.nom,r.tel,NOMTYPE[r.type]||r.type,r.spec,r.date,r.statut,r.note,r.created_by,(r.vu_at||'').slice(0,10)]);

function telecharger(nom,contenu,type){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenu],{type}));a.download=nom;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function restaurer(f){if(!f)return;const l=new FileReader();
  l.onload=()=>{try{const recs=JSON.parse(l.result);if(!Array.isArray(recs))throw 0;
    for(const r of recs){const loc=etat.records.find(x=>x.id===r.id);
      if(!loc)etat.records.push(r);
      else if((r.updated_at||'')>(loc.updated_at||''))Object.assign(loc,r);}
    etat.lastPush='';sauver();rendre();syncAuto();toast('Sauvegarde restaurée',recs.length+' fiches importées.');
  }catch(e){toast('Fichier invalide','Choisissez une sauvegarde JSON.','danger');}};
  l.readAsText(f);}

/* ============ SYNCHRO SUPABASE ============ */
let syncEnCours=false,syncTimer=null;
function syncAuto(){if(!pret())return;
  clearTimeout(syncTimer);syncTimer=setTimeout(()=>synchroniser(false),1500);}
const CHAMPS=['id','nom','tel','type','spec','date','heure','note','statut','vu_at','created_by','deleted','created_at','updated_at',
  'relance_at','relance_by','relance_canal','sms_auto'];
const NULLABLES=['vu_at','relance_at'];
let syncErreur=false;
function enAttenteEnvoi(){return etat.records.filter(r=>!etat.lastPush||(r.updated_at||'')>etat.lastPush).length;}
/* Pastille dans l'en-tête : hors ligne, ou modifications pas encore envoyées */
function majEtatSync(){
  const el=document.getElementById('etatSync');if(!el)return;
  const n=pret()?enAttenteEnvoi():0, off=!navigator.onLine;
  const txt=off?'Hors ligne'+(n?' · '+n:''):(syncErreur&&n?n+' non envoyée'+(n>1?'s':''):'');
  el.className='hsync'+(txt?' on':'');
  el.innerHTML=txt?ico(off?'wifi-off':'refresh-cw',14)+ech(txt):'';
  el.title=n?n+' modification(s) en attente d’envoi':'';
}
window.addEventListener('online',()=>{majEtatSync();syncAuto();});
window.addEventListener('offline',majEtatSync);
async function synchroniser(manuel){
  if(!pret()){if(manuel)toast('Connexion requise','Connectez-vous pour partager les fiches.','warning');return;}
  if(syncEnCours)return;syncEnCours=true;
  const dot=document.getElementById('syncDot');
  try{
    // 1. Envoyer seulement ce qui a changé ici depuis le dernier envoi.
    const debut=new Date().toISOString();
    const aEnvoyer=etat.records.filter(r=>!etat.lastPush||(r.updated_at||'')>etat.lastPush)
      .map(r=>{const o={};CHAMPS.forEach(k=>o[k]=r[k]==null?(NULLABLES.includes(k)?null:''):r[k]);o.deleted=r.deleted?1:0;o.sms_auto=r.sms_auto!==false;return o;});
    if(aEnvoyer.length)await api('rdv?on_conflict=id',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(aEnvoyer)});
    etat.lastPush=debut;
    // 2. Récupérer la version partagée ; la plus récente gagne.
    const dist=await api('rdv?select=*');
    await chargerCabinet();
    for(const r of dist){const loc=etat.records.find(x=>x.id===r.id);
      if(!loc)etat.records.push(r);
      else if((r.updated_at||'')>(loc.updated_at||''))Object.assign(loc,r);}
    etat.lastPull=new Date().toISOString();sauver();
    if(!document.getElementById('feuilleForm').classList.contains('ouverte'))rendreSiLibre();
    syncErreur=false;
    const d2=document.getElementById('syncDot');if(d2)d2.className='sdot on';
    if(manuel)toast('Synchronisation terminée',dist.length+' fiches partagées.');
  }catch(e){
    syncErreur=true;
    if(dot)dot.className='sdot err';
    if(manuel)toast('Échec de la synchronisation',e.message,'danger');
  }finally{syncEnCours=false;majEtatSync();}
}

/* ============ CONNEXION (Supabase Auth, code par e-mail) ============ */
function base(){return etat.supa.url.replace(/\/$/,'');}
async function appelAuth(chemin,corps){
  const r=await fetch(base()+'/auth/v1/'+chemin,{method:'POST',
    headers:{'apikey':etat.supa.key,'Content-Type':'application/json'},body:JSON.stringify(corps)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(r.status===429?'Trop de demandes. Patientez une minute avant de réessayer.'
      :(d.msg||d.error_description||d.message||('Erreur '+r.status)));e.status=r.status;throw e;}
  return d;
}
function garderSession(d){
  etat.auth={access_token:d.access_token,refresh_token:d.refresh_token,
    expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:{id:d.user.id,email:d.user.email}};
  sauver();
}
let _rafraichir=null;
/* Jeton d'accès valide (renouvelé au besoin) : la session ne se perd pas tant qu'on ne se déconnecte pas. */
async function jeton(){
  const a=etat.auth;if(!a)throw new Error('Non connecté');
  if(a.expires_at-60>Date.now()/1000)return a.access_token;
  if(!_rafraichir)_rafraichir=appelAuth('token?grant_type=refresh_token',{refresh_token:a.refresh_token})
    .then(d=>{garderSession(d);return d.access_token;})
    .catch(e=>{if(e.status>=400&&e.status<500)sessionPerdue();throw e;})
    .finally(()=>{_rafraichir=null;});
  return _rafraichir;
}
async function api(chemin,opts,deja){
  opts=opts||{};
  const r=await fetch(base()+'/rest/v1/'+chemin,Object.assign({},opts,{headers:Object.assign({
    'apikey':etat.supa.key,'Authorization':'Bearer '+await jeton(),'Content-Type':'application/json'},opts.headers||{})}));
  if(r.status===401){
    // Jeton refusé (horloge du téléphone décalée…) : on le renouvelle une fois avant d'abandonner.
    if(!deja&&etat.auth){etat.auth.expires_at=0;return api(chemin,opts,true);}
    sessionPerdue();throw new Error('Session expirée, reconnectez-vous.');}
  if(!r.ok){const d=await r.json().catch(()=>({}));const e=new Error(d.message||('Erreur '+r.status));e.status=r.status;throw e;}
  const t=await r.text();return t?JSON.parse(t):null;
}
function sessionPerdue(){etat.auth=null;sauver();etape='email';montrerAccueil();}

async function occuper(fn){if(occupe)return;occupe=true;rendreAccueilBoutons();

function validerConfig(){
  const u=document.getElementById('a_url').value.trim(), k=document.getElementById('a_key').value.trim();
  if(!/^(https:\/\/.+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$)/.test(u)||!k){toast('Configuration incomplète','Renseignez l’URL (https://…) et la clé.','danger');return;}
  etat.supa={url:u,key:k};sauver();etape='email';rendreAccueil();
}
function envoyerCode(){
  const champ=document.getElementById('a_email');if(champ)aEmail=champ.value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(aEmail)){toast('Adresse invalide','Vérifiez votre adresse e-mail.','danger');return;}
  occuper(async()=>{try{await appelAuth('otp',{email:aEmail,create_user:true});}catch(e){e.titre='Envoi du code impossible';throw e;}
    etape='code';rendreAccueil();toast('Code envoyé','Consultez votre boîte '+aEmail+'.','info');});
}
function verifierCode(){
  const code=document.getElementById('a_code').value.trim();
  if(code.length<6){toast('Code incomplet','Saisissez le code reçu par e-mail.','danger');return;}
  occuper(async()=>{
    try{garderSession(await appelAuth('verify',{type:'email',email:aEmail,token:code}));}
    catch(e){const k=e.status>=400&&e.status<500&&e.status!==429;
      const err=new Error(k?'Vérifiez le code reçu, ou demandez-en un nouveau.':e.message);
      err.titre=k?'Code incorrect ou expiré':'Vérification impossible';
      const c=document.getElementById('a_code');if(c){c.value='';c.focus();}throw err;}
    await verifierMembre(true);
  });
}
function creerProfil(){
  const nom=document.getElementById('a_nom').value.trim().replace(/\s+/g,' ');
  if(nom.length<2){toast('Nom manquant','Indiquez votre prénom et votre nom.','danger');return;}
  occuper(async()=>{
    try{await api('membres',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({id:etat.auth.user.id,nom,poste:aPoste})});}catch(e){e.titre='Enregistrement impossible';throw e;}
    await verifierMembre(true);
  });
}
/* Relit son propre compte : en attente, validé, retiré… */
async function verifierMembre(afficherErreur){
  try{
    const l=await api('membres?id=eq.'+etat.auth.user.id+'&select=nom,poste,valide,email');
    const m=l&&l[0], avant=pret();
    if(!m){
      // Compte retiré par le médecin : les données patients quittent l'appareil.
      if(etat.membre){etat.records=[];etat.lastPush='';etat.lastPull='';}
      etat.membre=null;sauver();etape='profil';montrerAccueil();return;
    }
    etat.membre=m;etat.user=m.nom;sauver();
    if(!m.valide){etape='attente';montrerAccueil();return;}
    cacherAccueil();
    if(!avant){ongletActif='jour';rendre();toast('Bienvenue '+m.nom,POSTES[m.poste]||'');synchroniser(false);planifierRappels();
      abonnerSilencieux();proposerNotif();}
    else rendreSurPlace();
    if(m.poste==='medecin')chargerEquipe();
  }catch(e){
    if(!etat.auth)return; // session perdue : l'écran de connexion est déjà affiché
    if(!pret()){aMsg=e.message;etape='erreur';montrerAccueil();}
    else if(afficherErreur)toast('Vérification impossible',e.message,'warning');
  }
}
async function deconnecter(){
  const nonEnvoyes=enAttenteEnvoi();
  if(!await demander({titre:'Se déconnecter ?',danger:true,ok:'Se déconnecter',
      texte:nonEnvoyes&&pret()?nonEnvoyes+' modification(s) pas encore envoyée(s) seront perdues. Les fiches seront retirées de cet appareil.'
        :'Les fiches seront retirées de cet appareil. Vous pourrez vous reconnecter avec votre e-mail.'}))return;
  const a=etat.auth;
  if(a)fetch(base()+'/auth/v1/logout',{method:'POST',headers:{'apikey':etat.supa.key,'Authorization':'Bearer '+a.access_token}}).catch(()=>{});
  if(window.RDVmedPush)RDVmedPush.desactiver();
  Object.assign(etat,{auth:null,membre:null,user:'',records:[],lastPush:'',lastPull:''});equipe=null;
  sauver();rendre();etape='email';montrerAccueil();
}
async function changerNom(v){
  const nom=v.trim().replace(/\s+/g,' ');if(nom.length<2||!pret()){rendre();return;}
  try{await api('membres?id=eq.'+etat.auth.user.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({nom})});
    etat.membre.nom=nom;etat.user=nom;sauver();toast('Nom mis à jour',nom);}
  catch(e){toast('Modification impossible',e.message,'danger');rendre();}
}

/* ============ INSTALLATION (Android : invite native ; iOS : marche à suivre) ============ */
let inviteInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();inviteInstall=e;});
window.addEventListener('appinstalled',()=>{inviteInstall=null;toast('Application installée','RDVmed est sur votre écran d\u2019accueil.');
  rendreSurPlace();if(document.getElementById('accueil').classList.contains('ouvert'))rendreAccueil();});
function estInstallee(){
  return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function estIOS(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);} // iPad récent se présente comme un Mac
async function installer(){
  if(inviteInstall){ // Chrome, Edge, Samsung Internet… : la fenêtre d'installation du système
    inviteInstall.prompt();
    const r=await inviteInstall.userChoice.catch(()=>null);
    inviteInstall=null;
    if(r&&r.outcome==='accepted')return;
  }
  const I=n=>'<span class="ic">'+ico(n,18)+'</span>';
  const etapes=estIOS()
    ?['Ouvrez cette page dans <b>Safari</b>.',
      'Touchez le bouton <b>Partager</b> '+I('share')+' en bas de l\u2019écran (en haut sur iPad).',
      'Faites défiler et choisissez <b>Sur l\u2019écran d\u2019accueil</b> '+I('square-plus')+'.',
      'Touchez <b>Ajouter</b> en haut à droite.']
    :['Ouvrez le menu du navigateur '+I('more-vertical')+' (en haut à droite dans Chrome).',
      'Choisissez <b>Installer l\u2019application</b> ou <b>Ajouter à l\u2019écran d\u2019accueil</b>.',
      'Confirmez avec <b>Installer</b>.'];
  document.getElementById('modale').innerHTML=
    '<div class="mh"><div><div class="mt">Installer RDVmed</div>'+
    '<div class="md" style="margin-bottom:0">'+(estIOS()?'Sur iPhone / iPad':'Sur Android')+'</div></div>'+
    '<button class="ib" onclick="fermerVoile()" aria-label="Fermer">'+ico('x',20)+'</button></div>'+
    '<ol class="etapes">'+etapes.map(t=>'<li><span>'+t+'</span></li>').join('')+'</ol>'+
    '<div class="hint">L\u2019icône RDVmed apparaît ensuite sur l\u2019écran d\u2019accueil'+
    (estIOS()?'. Ouvrez l\u2019application depuis cette icône pour recevoir les notifications.':'.')+'</div>'+
    '<button class="btn outline full" style="margin-top:14px" onclick="fermerVoile()">J\u2019ai compris</button>';
  document.getElementById('voile').classList.add('ouvert');
}

/* ============ ÉQUIPE (médecin) ============ */
let equipe=null;
function enAttente(){return estMedecin()&&equipe?equipe.filter(m=>!m.valide):[];}
async function chargerEquipe(){
  try{equipe=await api('membres?select=id,nom,poste,valide,email&order=valide.asc,nom.asc');}catch(e){return;}
  if(ongletActif==='reglages')rendreSiLibre();else rendre();
}
function vueEquipe(){
  let h='<div class="card md" style="margin-top:12px">'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="display:inline-flex;color:var(--brand-secondary)">'+ico('users',20)+
  '</span><span style="font-size:var(--text-base);font-weight:600;color:var(--text-heading)">Équipe</span></div>'+
  '<div style="font-size:var(--text-sm);line-height:1.5">Validez les nouveaux comptes et attribuez les postes. Seul un médecin peut supprimer une fiche.</div>';
  if(!equipe)return h+'<div class="hint">Chargement…</div></div>';
  for(const m of equipe){const moi=m.id===etat.auth.user.id;
    h+='<div class="nrow" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><div class="nn">'+ech(m.nom)+(moi?' <span class="badge neutral">vous</span>':'')+'</div>'+
      '<div class="nq">'+ech(m.email||'')+'</div></div>'+
      (m.valide?'<span class="badge success">'+ech(POSTES[m.poste]||m.poste)+'</span>':'<span class="badge warning">En attente</span>');
    if(!moi){
      h+='<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center">'+
        Object.entries(POSTES).map(([k,l])=>'<button class="tag'+(m.poste===k?' sel':'')+'" onclick="posteMembre(\''+m.id+'\',\''+k+'\')">'+l+'</button>').join('')+
        '<span style="flex:1"></span>'+
        (m.valide?'':'<button class="btn primary sm" onclick="validerMembre(\''+m.id+'\')">'+ico('check',16)+'Valider</button>')+
        '<button class="ib sm" onclick="retirerMembre(\''+m.id+'\')" aria-label="'+(m.valide?'Retirer':'Refuser')+' '+ech(m.nom)+'">'+ico('user-x',16)+'</button></div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
async function gererMembre(id,poste,valide){
  await api('rpc/gerer_membre',{method:'POST',body:JSON.stringify({p_id:id,p_poste:poste,p_valide:valide})});
}
async function posteMembre(id,poste){const m=(equipe||[]).find(x=>x.id===id);if(!m)return;
  if(!m.valide){m.poste=poste;rendreSurPlace();return;} // choix appliqué à la validation
  try{await gererMembre(id,poste,true);toast('Poste modifié',m.nom+' · '+POSTES[poste]);}
  catch(e){toast('Modification impossible',e.message,'danger');}
  chargerEquipe();
}
async function validerMembre(id){const m=(equipe||[]).find(x=>x.id===id);if(!m)return;
  try{await gererMembre(id,m.poste,true);toast('Compte validé',m.nom+' · '+POSTES[m.poste]);}
  catch(e){toast('Validation impossible',e.message,'danger');}
  chargerEquipe();
}
async function retirerMembre(id){const m=(equipe||[]).find(x=>x.id===id);if(!m)return;
  if(!await demander({titre:(m.valide?'Retirer ':'Refuser ')+m.nom+' ?',danger:true,ok:m.valide?'Retirer':'Refuser',
      texte:'Cette personne n’aura plus accès aux rendez-vous.'}))return;
  try{await api('membres?id=eq.'+id,{method:'DELETE'});toast(m.valide?'Membre retiré':'Demande refusée',m.nom,'warning');}
  catch(e){toast('Action impossible',e.message,'danger');}
  chargerEquipe();
}

/* ============ TOAST ============ */
let toastTimer=null;
function toast(titre,texte,tone,action){
  const t=document.getElementById('toast');
  _annuler=null; // un nouveau message remplace l'annulation proposée
  t.className='on'+(tone&&tone!=='success'?' '+tone:'')+(action?' act':'');
  t.innerHTML='<div class="tx"><div class="tt">'+ech(titre)+'</div>'+(texte?'<div class="td">'+ech(texte)+'</div>':'')+'</div>'+
    (action?'<button class="ta" onclick="document.getElementById(\'toast\').className=\'\';'+action.fn+'">'+ech(action.label)+'</button>':'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='';_annuler=null;},action?7000:3200);
}

/* ============ DÉMARRAGE ============ */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function demarrer(){
  appliquerConfig();rendre();
  if(!etat.supa.url||!etat.supa.key){etape='config';montrerAccueil();return;}
  if(!etat.auth){etape='email';montrerAccueil();return;}
  if(pret()){cacherAccueil();synchroniser(false);planifierRappels();abonnerSilencieux();proposerNotif();} // fonctionne aussi hors ligne
  verifierMembre(false);
}
demarrer();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!etat.auth)return;
  if(etape==='attente'&&!pret())verifierMembre(false);else if(pret())syncAuto();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){fermerVoile();fermerForm();}});
</script>
